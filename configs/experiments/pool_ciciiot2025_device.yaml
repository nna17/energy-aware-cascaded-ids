# A1: candidate tier models, trained once per seed. Each family expands over its lists.
# n_features = only the first k ranked flow features (39 = all), which models cheaper feature extraction.
name: pool_ciciiot2025_device
dataset: configs/data/ciciiot2025_device.yaml
seeds: [0, 1, 2]
balanced: true
out_dir: results/pools_device     # v2: stores margin as well as confidence, includes compact MLPs
models:
  - {kind: decision_tree, max_leaves: [16, 64, 256, 1024], n_features: [5, 10, 20, 71]}
  - {kind: random_forest, n_estimators: [5, 10, 25, 50], max_leaves: [32, 128, 512]}
  # Server-tier reference: an unrestricted forest (few comparisons, megabytes of memory -> server only).
  - {kind: random_forest, n_estimators: [50], max_leaves: [null]}
  - {kind: extra_trees, n_estimators: [5, 10, 25, 50], max_leaves: [32, 128, 512]}
  - {kind: lightgbm, n_estimators: [10, 50, 200], max_leaves: [8, 32]}
  # Non-tree detectors (reviewer request): compact MLPs, cost = multiply-accumulates, size = INT8 weights.
  - {kind: mlp, hidden: [[16], [32], [64, 32]], n_features: [20, 71], epochs: 10}
