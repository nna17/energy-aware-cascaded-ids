[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eids"
license = {text = "MIT"}
version = "0.1.0"
description = "Energy-aware multi-objective design of cascaded intrusion detection for IoT-edge networks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "lightgbm",
    "xgboost",
    "pymoo",
    "pyyaml",
    "optuna",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
